name: tests

# Runs the test suite on every pull request and on every push to main. The
# tests use temporary SQLite databases, so no secrets or network are needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      # The default sync installs the dev group, which includes the ml extra.
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
