name: pipeline

on:
  schedule:
    # Every 10 minutes (UTC). The offset avoids :00, when GitHub is busiest and
    # delays or drops scheduled runs.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m mobi.pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}