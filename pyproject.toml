[project]
name = "mobi-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.9.1",
]
app = [
    "gradio>=6.32.0",
    "plotly>=7.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobi"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
